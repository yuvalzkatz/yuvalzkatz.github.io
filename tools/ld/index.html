<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!-- Unlisted: reachable only by direct link, kept out of search results. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>הכרעה לקסיקלית</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="app">

  <!-- 1. Welcome / name ------------------------------------------------- -->
  <section id="screen-welcome" class="screen active">
    <h1>הכרעה לקסיקלית</h1>
    <p class="lead">ברוכים הבאים. לפני שמתחילים, נא להקליד את שמכם.</p>
    <label class="field-label" for="participant-name">שם</label>
    <input
      id="participant-name"
      type="text"
      class="text-input"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      enterkeyhint="done">
    <p id="name-error" class="error" hidden>נא להקליד שם כדי להתחיל.</p>
    <button id="btn-start" class="btn btn-primary" type="button">התחלה</button>
  </section>

  <!-- 2. General instructions ------------------------------------------- -->
  <section id="screen-general" class="screen">
    <h2>הוראות</h2>
    <p id="general-instructions" class="instructions"></p>
    <button id="btn-general-continue" class="btn btn-primary" type="button">המשך</button>
  </section>

  <!-- 3. Ready / rest ----------------------------------------------------- -->
  <!-- Shown once before the first trial, and again at each rest break. -->
  <section id="screen-ready" class="screen">
    <p id="ready-heading" class="block-heading"></p>
    <p id="ready-text" class="instructions"></p>
    <button id="btn-ready-continue" class="btn btn-primary" type="button">מוכנים, להתחיל</button>
  </section>

  <!-- 4. Fixation cross ---------------------------------------------------- -->
  <!-- Sits exactly where the word will appear, so the eye is already there. -->
  <section id="screen-fixation" class="screen screen-centered">
    <div class="fixation" aria-hidden="true">+</div>
  </section>

  <!-- 5. Stimulus (one word, 400 ms) -------------------------------------- -->
  <section id="screen-stimulus" class="screen screen-centered">
    <div id="stimulus" class="stimulus"></div>
  </section>

  <!-- 6. Response --------------------------------------------------------- -->
  <!-- The row is RTL, so the first button below is the one on the RIGHT. -->
  <section id="screen-response" class="screen screen-centered">
    <p class="prompt">האם זו מילה בעברית?</p>
    <div class="choice-row">
      <button id="btn-word" class="btn btn-choice btn-yes" type="button"></button>
      <button id="btn-nonword" class="btn btn-choice btn-no" type="button"></button>
    </div>
  </section>

  <!-- 7. Blank inter-trial screen ------------------------------------------ -->
  <section id="screen-blank" class="screen screen-centered"></section>

  <!-- 8. End ---------------------------------------------------------------- -->
  <section id="screen-end" class="screen screen-centered">
    <h2 id="end-title">תודה רבה!</h2>
    <p class="lead">הניסוי הסתיים. תודה על ההשתתפות.</p>
    <p id="upload-status" class="upload-status"></p>
    <button id="btn-download-csv" class="btn btn-secondary" type="button" hidden>הורדת קובץ תוצאות (CSV)</button>
    <button id="btn-retry-upload" class="btn btn-secondary" type="button" hidden>ניסיון שליחה נוסף</button>
  </section>

</main>

<script src="config.js"></script>
<script src="items.js"></script>
<script src="app.js"></script>
</body>
</html>
